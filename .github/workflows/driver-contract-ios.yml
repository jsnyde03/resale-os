# The driver contract, executed against expo-sqlite on a real iOS Simulator.
#
# ⛔ WHY THIS EXISTS. The phone port (Gate 5) rests on `mobile/src/db/expo-driver.ts`
# behaving exactly like `src/db/driver.ts`. Both passing their own tests would
# prove nothing about each other, so `src/db/driver-contract.ts` holds the cases
# ONCE and two runners execute them: Vitest against `node:sqlite` (every `npm run
# check`), and this lane against `expo-sqlite` on Apple's own SQLite.
#
# It exists as CI rather than as a local run because this developer's machine has
# no iOS simulator (Windows), no spare RAM for an Android emulator, and no phone
# that may carry a VPN — see the A4 history in MASTER_PLAN.
#
# ⚠️ THE VERDICT COMES FROM A FILE, NOT FROM THE LOG. React Native's console.log
# lines do not survive `-configuration Release` — measured in debt-app-v1's
# native-e2e lane, zero matches across 3,590 lines. The app writes
# `driver-contract-result.json` into its documents directory and this job reads
# it out of the simulator container. The file is also written OUTSIDE the driver
# under test, so "no result" means "the app never ran" rather than "the driver
# is broken", which are different failures.
name: Driver contract (expo-sqlite · iOS Simulator)

# Manual only. A ~20-minute macOS job per commit is not worth it, and the
# contract only changes when the driver or the interface does.
on:
  workflow_dispatch:
  push:
    # ⚠️ Everything the on-device run actually depends on. The first version
    # listed only the driver and the contract, so a fix to the migration
    # bundling did not trigger a run and I watched a stale result.
    paths:
      - 'src/db/**'
      - 'src/core/**'
      - 'mobile/**'
      - 'tests/driver-node.test.ts'
      - 'tests/engine-scenario-node.test.ts'
      - 'tests/migrations-bundle.test.ts'
      - 'tests/hash.test.ts'
      - '.github/workflows/driver-contract-ios.yml'

jobs:
  contract:
    # ⚠️ macos-15 FAILS: its Xcode ships Swift tools 6.1.0 and Expo 56 / RN 0.85
    # pull an Apple package requiring 6.2.0 —
    #   "package 'apple' is using Swift tools version 6.2.0 but the installed
    #    version is 6.1.0"
    # which surfaces as an opaque exit 65 inside a Pods script phase. Swift 6.2
    # ships with Xcode 26.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Print what the image actually has before using it. The Swift-version
      # mismatch above cost a round trip precisely because nothing said which
      # toolchain was in play.
      - name: Select the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$NEWEST" ]; then sudo xcode-select -s "$NEWEST/Contents/Developer"; fi
          xcodebuild -version
          swift --version

      # `--legacy-peer-deps` matches the local install. npm's arborist errors
      # with `Cannot read properties of null (reading 'edgesOut')` without it on
      # this dependency set, and the message says nothing about peers.
      - name: Install
        working-directory: mobile
        run: npm install --legacy-peer-deps

      - name: Typecheck both halves
        run: |
          npm install --legacy-peer-deps
          npm run typecheck
          cd mobile && npx tsc --noEmit

      # The contract also runs against node:sqlite here, so a failure on the
      # phone can be read against a known-good baseline in the same log.
      - name: Contract and scenario against node:sqlite (baseline)
        run: npx vitest run tests/driver-node.test.ts tests/engine-scenario-node.test.ts tests/migrations-bundle.test.ts tests/hash.test.ts

      - name: Generate the native project
        working-directory: mobile
        env:
          EXPO_PUBLIC_RUN_CONTRACT: '1'
        run: npx expo prebuild --platform ios

      # ⚠️ `expo prebuild` runs pod install but treats it as best-effort: it
      # prints CocoaPods errors and continues, so a real failure surfaces later
      # as a misleading "workspace does not exist". Run it as its own step.
      - name: pod install
        working-directory: mobile/ios
        run: pod install

      - name: Build for the simulator
        working-directory: mobile
        env:
          EXPO_PUBLIC_RUN_CONTRACT: '1'
        run: |
          set -o pipefail
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "workspace=$WORKSPACE scheme=$SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath ios/build \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee xcodebuild.log | tail -40

      # ⚠️ The first run failed inside a Pods script phase and `tail -40` had
      # already thrown the script's own output away — the log showed only which
      # phase failed, not why. Keep the whole thing, and surface the error lines
      # explicitly; a truncated log is a second debugging round trip.
      - name: Why the build failed
        if: failure()
        working-directory: mobile
        run: |
          echo '=== error lines ==='
          grep -nE "error:|error |fatal|No such file|command not found|Permission denied" xcodebuild.log | head -40 || true
          echo '=== the last 120 lines ==='
          tail -120 xcodebuild.log

      - name: Upload the build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: mobile/xcodebuild.log
          if-no-files-found: ignore

      - name: Boot a simulator, run the app, read the verdict
        working-directory: mobile
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+[A-Za-z ]*' | sed 's/ *$//' | sort -V | tail -1)
          echo "device: $DEVICE"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b || true

          APP=$(find ios/build/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          echo "app=$APP bundle=$BUNDLE_ID"

          xcrun simctl install booted "$APP"
          xcrun simctl launch booted "$BUNDLE_ID" || true

          # The app runs the contract on mount and writes the file. Poll for it
          # rather than sleeping a fixed amount: a fixed sleep is either slower
          # than it needs to be or shorter than the run.
          CONTAINER=$(xcrun simctl get_app_container booted "$BUNDLE_ID" data)
          RESULT="$CONTAINER/Documents/driver-contract-result.json"
          DEADLINE=$(( $(date +%s) + 90 ))
          until [ -f "$RESULT" ]; do
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::No result file after 90s — the app did not run the contract."
              xcrun simctl io booted screenshot no-result.png || true
              exit 1
            fi
            sleep 2
          done

          echo '=== driver-contract-result.json ==='
          cat "$RESULT"
          cp "$RESULT" ./driver-contract-result.json

          # ⛔ The gate. `allPass` must be true; anything else fails the job.
          node -e '
            const r = require("./driver-contract-result.json");
            const failed = r.cases.filter((c) => !c.passed);
            for (const c of failed) console.log(`FAILED: ${c.name} :: ${c.error}`);
            console.log(`${r.passed}/${r.total} passed`);
            if (!r.allPass) { console.error("driver contract FAILED against expo-sqlite"); process.exit(1); }
          '

      - name: Upload the verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driver-contract-result
          path: |
            mobile/driver-contract-result.json
            mobile/no-result.png
          if-no-files-found: ignore

