# The driver contract, executed against expo-sqlite on a real iOS Simulator.
#
# ⛔ WHY THIS EXISTS. The phone port (Gate 5) rests on `mobile/src/db/expo-driver.ts`
# behaving exactly like `src/db/driver.ts`. Both passing their own tests would
# prove nothing about each other, so `src/db/driver-contract.ts` holds the cases
# ONCE and two runners execute them: Vitest against `node:sqlite` (every `npm run
# check`), and this lane against `expo-sqlite` on Apple's own SQLite.
#
# It exists as CI rather than as a local run because this developer's machine has
# no iOS simulator (Windows), no spare RAM for an Android emulator, and no phone
# that may carry a VPN — see the A4 history in MASTER_PLAN.
#
# ⚠️ THE VERDICT COMES FROM A FILE, NOT FROM THE LOG. React Native's console.log
# lines do not survive `-configuration Release` — measured in debt-app-v1's
# native-e2e lane, zero matches across 3,590 lines. The app writes
# `driver-contract-result.json` into its documents directory and this job reads
# it out of the simulator container. The file is also written OUTSIDE the driver
# under test, so "no result" means "the app never ran" rather than "the driver
# is broken", which are different failures.
name: Driver contract (expo-sqlite · iOS Simulator)

# Manual only. A ~20-minute macOS job per commit is not worth it, and the
# contract only changes when the driver or the interface does.
on:
  workflow_dispatch:
  push:
    # ⚠️ Everything the on-device run actually depends on. The first version
    # listed only the driver and the contract, so a fix to the migration
    # bundling did not trigger a run and I watched a stale result.
    paths:
      - 'src/db/**'
      - 'src/core/**'
      # ⚠️ `src/ui/**` was missing for as long as it existed — the pure form
      # models the write screens are made of, and half of what the on-device
      # screen contract executes. An enumerated path list is a list of the
      # directories that existed when someone last thought about it.
      - 'src/ui/**'
      # ⚠️ AND AGAIN, 2026-09-10 — the note above was written about `src/ui`
      # and then this list went stale the same way twice more in one item.
      # 5.8 put `src/server/views.ts` on the device and 5.9c put
      # `src/scoring/purchase.ts` (and `src/domain` behind it) there, so all
      # three are executed by the on-device screen contract and none of them
      # triggered a run. ⛔ The list keeps being wrong because it is written by
      # hand while the closure is computed: `npm run lint:phone` DISCOVERS the
      # roots by scanning `mobile/`, and this cannot. → B67.
      # ⚡ `src/screens/**` was added by the GATE, not by memory: 5.10.3 moved
      # views.ts and sourcing.ts here and `tests/ci-scope.test.ts` went red the
      # same minute. Third time this filter went stale; first time something
      # other than a person noticed.
      - 'src/screens/**'
      - 'src/scoring/**'
      - 'src/domain/**'
      # ⚡ And a FOURTH time, 2026-09-11 — 6.1.3 put `src/adapters/**` on the
      # device and `tests/ci-scope.test.ts` went red within the minute, before
      # a single commit. **Second time the gate caught it and first time it
      # caught a brand-new layer**, which is the case the hand-written list is
      # worst at: nobody forgets a directory they are busy creating, they
      # forget the list that has to mention it.
      - 'src/adapters/**'
      - 'mobile/**'
      - 'tests/driver-node.test.ts'
      - 'tests/engine-scenario-node.test.ts'
      - 'tests/screen-scenario-node.test.ts'
      - 'tests/forms.test.ts'
      - 'tests/migrations-bundle.test.ts'
      - 'tests/hash.test.ts'
      - '.github/workflows/driver-contract-ios.yml'

jobs:
  contract:
    # ⚠️ macos-15 FAILS: its Xcode ships Swift tools 6.1.0 and Expo 56 / RN 0.85
    # pull an Apple package requiring 6.2.0 —
    #   "package 'apple' is using Swift tools version 6.2.0 but the installed
    #    version is 6.1.0"
    # which surfaces as an opaque exit 65 inside a Pods script phase. Swift 6.2
    # ships with Xcode 26.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Print what the image actually has before using it. The Swift-version
      # mismatch above cost a round trip precisely because nothing said which
      # toolchain was in play.
      - name: Select the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$NEWEST" ]; then sudo xcode-select -s "$NEWEST/Contents/Developer"; fi
          xcodebuild -version
          swift --version

      # `--legacy-peer-deps` matches the local install. npm's arborist errors
      # with `Cannot read properties of null (reading 'edgesOut')` without it on
      # this dependency set, and the message says nothing about peers.
      - name: Install
        working-directory: mobile
        run: npm install --legacy-peer-deps

      - name: Typecheck every half (node, web, phone)
        run: |
          npm install --legacy-peer-deps
          npm run typecheck
          # ⛔ Before anything is built: nothing the phone imports may REACH a
          # node builtin, however many hops away. `views.ts` was one import from
          # dragging the desktop SQLite driver into the bundle.
          npm run lint:phone
          cd mobile && npx tsc --noEmit

      # The contract also runs against node:sqlite here, so a failure on the
      # phone can be read against a known-good baseline in the same log.
      - name: Contract and scenario against node:sqlite (baseline)
        run: npx vitest run tests/driver-node.test.ts tests/engine-scenario-node.test.ts tests/screen-scenario-node.test.ts tests/forms.test.ts tests/migrations-bundle.test.ts tests/hash.test.ts

      # ⛔ PIN HERMES, because the podspec's fallback is silent and moving.
      #
      # `hermes_source_type()` asks whether a prebuilt release tarball EXISTS on
      # Maven Central, and if the request fails it falls through to
      # BUILD_FROM_GITHUB_MAIN — the tip of a branch. That is not a build
      # failure; it is a different input, chosen by a network round trip.
      #
      # Measured 2026-09-09, forty minutes apart, same commit:
      #   run 1  "Using release tarball from URL: …/250829098.0.10/…"  → built
      #   run 2  "Using the latest commit from 250829098.0.0-stable"   → 4,000
      #          lines of C++ ending in `no type named 'TypedArray' in
      #          namespace 'facebook::jsi'` — branch tip ahead of RN 0.85.3
      # The artifact was still LISTED in the Maven directory while a direct GET
      # returned 404. A CDN hiccup silently changed what the app was built from.
      #
      # So: fetch it here, with retries, and hand the podspec a local file —
      # `LOCAL_PREBUILT_TARBALL` outranks every other source type. A download
      # that genuinely fails now stops the job instead of quietly compiling
      # something else.
      - name: Which Hermes this React Native wants
        id: hermes
        working-directory: mobile
        run: |
          PROPS=node_modules/react-native/sdks/hermes-engine/version.properties
          # RCT_HERMES_V1_ENABLED is unset, so the podspec takes the V1 name.
          echo "version=$(grep '^HERMES_V1_VERSION_NAME=' "$PROPS" | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      # ⚡ Cached by VERSION, so this lane stops depending on a third party
      # being up. `repo.reactnative.dev` calls itself a "React Native Maven
      # Cache", and on 2026-09-09 it served the directory listing — the file
      # named, sized at 23 MB, dated March — while every GET returned 404, for
      # three consecutive versions. Nothing we can fix; everything we can
      # survive, once.
      - name: Restore the pinned Hermes
        id: hermes-cache
        uses: actions/cache/restore@v4
        with:
          path: mobile/hermes-ios.tar.gz
          key: hermes-ios-${{ steps.hermes.outputs.version }}-release

      - name: Pin the Hermes binary
        working-directory: mobile
        run: |
          set -euo pipefail
          V='${{ steps.hermes.outputs.version }}'
          echo "hermes $V"
          if [ -s hermes-ios.tar.gz ]; then
            echo "from cache"
          else
            URL="https://repo1.maven.org/maven2/com/facebook/hermes/hermes-ios/$V/hermes-ios-$V-hermes-ios-release.tar.gz"
            echo "$URL"
            for i in 1 2 3 4 5; do
              if curl -fsSL --retry 3 --retry-delay 2 -o hermes-ios.tar.gz "$URL"; then break; fi
              echo "attempt $i failed; retrying"
              sleep $(( i * 10 ))
            done
          fi
          if [ ! -s hermes-ios.tar.gz ]; then
            echo "::error::Could not fetch the prebuilt Hermes $V, and nothing was cached."
            echo "Building from the branch tip instead is how this lane produced a"
            echo "jsi mismatch on 2026-09-09, so it stops here rather than guessing."
            echo "If the listing shows the file but a GET 404s, the artifact host is"
            echo "down and the only thing to do is wait and re-run."
            exit 1
          fi
          ls -l hermes-ios.tar.gz
          echo "HERMES_ENGINE_TARBALL_PATH=$PWD/hermes-ios.tar.gz" >> "$GITHUB_ENV"

      # ⚠️ Saved explicitly rather than by `actions/cache`'s post step, which
      # runs only when the job succeeds. The whole point is to hold on to a
      # binary fetched during a run that then failed for some other reason.
      - name: Keep it
        if: always() && steps.hermes-cache.outputs.cache-hit != 'true' && hashFiles('mobile/hermes-ios.tar.gz') != ''
        uses: actions/cache/save@v4
        with:
          path: mobile/hermes-ios.tar.gz
          key: hermes-ios-${{ steps.hermes.outputs.version }}-release

      - name: Generate the native project
        working-directory: mobile
        env:
          EXPO_PUBLIC_RUN_CONTRACT: '1'
        run: npx expo prebuild --platform ios

      # ⚠️ `expo prebuild` runs pod install but treats it as best-effort: it
      # prints CocoaPods errors and continues, so a real failure surfaces later
      # as a misleading "workspace does not exist". Run it as its own step.
      - name: pod install
        working-directory: mobile/ios
        run: pod install

      - name: Hermes came from the tarball, not from a branch
        working-directory: mobile
        run: |
          # ⚡ The control on the pin above, and it reads the RESOLVER'S OWN
          # ANSWER rather than inferring one. The first version asserted that
          # `destroot/Library/Frameworks/ios/hermesvm.framework` existed after
          # pod install — a guess at an extraction path, and a wrong one: the
          # pin had held and the check failed anyway, 2026-09-09.
          #
          # ⛔ Diagnose the CHECK before the thing under test. `Podfile.lock`
          # records which subspec CocoaPods chose, and `Pre-built` is the
          # podspec's own word for "this came from a tarball"; building from
          # source resolves a different subspec entirely.
          # ⚠️ Verified against both real strings, not assumed: the podspec
          # branches `isPrebuilt -> subspec 'Pre-built'` and `isFromSource ->
          # subspec 'Hermes'`, so the two are mutually exclusive in the lock.
          grep -E "hermes-engine" ios/Podfile.lock || true
          if ! grep -q "hermes-engine/Pre-built" ios/Podfile.lock; then
            echo "::error::Hermes did not resolve to the Pre-built subspec — the pin did not hold."
            exit 1
          fi
          echo "hermes-engine resolved Pre-built: the pinned tarball was used."

      - name: Build for the simulator
        working-directory: mobile
        env:
          EXPO_PUBLIC_RUN_CONTRACT: '1'
        run: |
          set -o pipefail
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "workspace=$WORKSPACE scheme=$SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath ios/build \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee xcodebuild.log | tail -40

      # ⚠️ The first run failed inside a Pods script phase and `tail -40` had
      # already thrown the script's own output away — the log showed only which
      # phase failed, not why. Keep the whole thing, and surface the error lines
      # explicitly; a truncated log is a second debugging round trip.
      - name: Why the build failed
        if: failure()
        working-directory: mobile
        run: |
          echo '=== error lines ==='
          grep -nE "error:|error |fatal|No such file|command not found|Permission denied" xcodebuild.log | head -40 || true
          echo '=== the last 120 lines ==='
          tail -120 xcodebuild.log

      - name: Upload the build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: mobile/xcodebuild.log
          if-no-files-found: ignore

      - name: Boot a simulator, run the app, read the verdict
        working-directory: mobile
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+[A-Za-z ]*' | sed 's/ *$//' | sort -V | tail -1)
          echo "device: $DEVICE"
          # ⛔ **A SICK BOOT MUST NOT BE SILENT.** `bootstatus ... || true` swallowed
          # the exit code, so a simulator that never finished booting was
          # installed into and launched anyway — and the failure surfaced 90
          # seconds later as "the app did not run the contract", which blames the
          # app for a boot problem. Measured 2026-09-10: boot spent 2m22s on
          # CloudTabs/Vibrations data migrations, ended status 4294967295, and the
          # SAME COMMIT passed on a re-run. A gate that fails randomly stops being
          # read, which is worse than one that fails loudly.
          #
          # ⛔ **AND IT RECURRED, 2026-09-11 — because the fix read the wrong
          # signal.** `xcrun simctl bootstatus -b` **exited 0** on a boot that
          # printed `Status=4294967295, isTerminal=YES`, so the guard above
          # never fired, the app was installed into a sick simulator, and the
          # error again said "the app did not run the contract".
          #
          # ⚠️ **The comment already named the status and the code checked `$?`.**
          # The 2026-09-10 measurement recorded `ended status 4294967295` right
          # here, and the control built from it watched the exit code instead —
          # the same class as every other "verify the effect, not the exit" entry
          # in this repo. **A control that has never been planted is not a
          # control**, and this one was only ever planted against a boot that
          # exits non-zero, which is not the failure that happens.
          #
          # So: read the status it PRINTS, and confirm the device is really
          # booted. ⚠️ Only an EXPLICITLY non-zero terminal status fails — an
          # output shape we have not seen must not red-gate a healthy lane,
          # because the contract itself is the real gate and this is a flake
          # detector. Planted on the captured log text of the 2026-09-11
          # failure: caught, with no false alarm on a healthy boot or on an
          # unfamiliar shape.
          boot_once() {
            local out bad
            xcrun simctl boot "$DEVICE" 2>/dev/null || true
            if ! out=$(xcrun simctl bootstatus "$DEVICE" -b 2>&1); then
              echo "$out"
              return 1
            fi
            echo "$out"
            # ⛔ `|| true` is LOAD-BEARING. Under `set -euo pipefail` a `grep`
            # that matches nothing exits 1, and a failing command substitution
            # in an assignment aborts the step — so without it this guard would
            # have killed every HEALTHY boot, which is the one outcome worse
            # than the flake it exists to catch. Measured before pushing.
            bad=$(echo "$out" | grep -oE 'Status=[0-9]+, isTerminal=YES' | grep -v 'Status=0,' | tail -1) || true
            if [ -n "$bad" ]; then
              echo "bootstatus exited 0 but reported: $bad"
              return 1
            fi
            # The effect, not the exit: the device must actually be Booted.
            xcrun simctl list devices | grep -F "$DEVICE" | grep -q '(Booted)'
          }
          if ! boot_once; then
            echo "::warning::the simulator did not finish booting - shutting it down and retrying once"
            xcrun simctl shutdown "$DEVICE" 2>/dev/null || true
            sleep 5
            if ! boot_once; then
              echo "::error::the simulator failed to boot twice - this is the RUNNER, not the app."
              exit 1
            fi
          fi

          APP=$(find ios/build/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          echo "app=$APP bundle=$BUNDLE_ID"

          xcrun simctl install booted "$APP"

          # ⚠️ Launched with the console attached, in the background.
          #
          # The app installed and launched cleanly on 2026-09-09 and then died
          # before writing anything, and this lane could say NOTHING about why:
          # RN strips `console.log` from a Release build, and a JS exception
          # thrown before the write means no result file — which is the same
          # observable as "the app never started". An unhandled error still
          # reaches stderr, and this is the only place it exists.
          #
          # `--console-pty` blocks until the app exits, so it is backgrounded and
          # the poll below is what decides the outcome.
          ( xcrun simctl launch --console-pty booted "$BUNDLE_ID" > app-console.log 2>&1 || true ) &

          # The app runs the contract on mount and writes the file. Poll for it
          # rather than sleeping a fixed amount: a fixed sleep is either slower
          # than it needs to be or shorter than the run.
          CONTAINER=$(xcrun simctl get_app_container booted "$BUNDLE_ID" data)
          RESULT="$CONTAINER/Documents/driver-contract-result.json"
          # ⚠️ 180s, not 90. A first launch on a freshly-migrated simulator is slow,
          # and the budget was tight enough that a healthy-but-slow boot looked
          # like a dead app. The poll exits the moment the file appears, so a
          # longer deadline costs nothing on a good run.
          DEADLINE=$(( $(date +%s) + 180 ))
          until [ -f "$RESULT" ]; do
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::No result file after 180s - the app did not run the contract."
              xcrun simctl io booted screenshot no-result.png || true
              echo '=== app console ==='
              cat app-console.log 2>/dev/null || echo '(no console output)'
              echo '=== crash reports ==='
              # A simulator app's crash report lands on the HOST, not in the
              # simulator container.
              find ~/Library/Logs/DiagnosticReports -name '*.ips' -newermt '-10 minutes' 2>/dev/null                 | while read -r f; do echo "--- $f"; head -60 "$f"; done
              echo '=== the app process, from the simulator log ==='
              xcrun simctl spawn booted log show --last 3m --style compact                 --predicate 'process == "ResaleOS"' 2>/dev/null | tail -80 || true
              exit 1
            fi
            sleep 2
          done

          echo '=== driver-contract-result.json ==='
          cat "$RESULT"
          cp "$RESULT" ./driver-contract-result.json

          # ⛔ The gate. `allPass` must be true; anything else fails the job.
          node -e '
            const r = require("./driver-contract-result.json");
            const failed = r.cases.filter((c) => !c.passed);
            for (const c of failed) console.log(`FAILED: ${c.name} :: ${c.error}`);
            console.log(`${r.passed}/${r.total} passed`);
            if (!r.allPass) { console.error("driver contract FAILED against expo-sqlite"); process.exit(1); }
          '

      - name: Upload the verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driver-contract-result
          path: |
            mobile/driver-contract-result.json
            mobile/no-result.png
            mobile/app-console.log
          if-no-files-found: ignore

# Registered on GitHub 2026-09-09.
